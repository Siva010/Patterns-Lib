<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{LC}} &middot; {{NAME}} &mdash; visual guide</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
/* ============================================================
   Three Patterns, No Gaps — playground stylesheet
   House shell (warm paper, light/dark) + a 5-role semantic
   palette for pointer state. No gradients, no shadows.
   ============================================================ */

:root {
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --bg: #fbfaf8;
  --bg-sunk: #f4f2ed;
  --bg-code: #f6f4ef;
  --fg: #17171a;
  --fg-mid: #4a4842;
  --fg-dim: #6d6b64;
  --rule: #e3dfd7;
  --rule-hard: #cbc5b8;
  --accent: #9c3a1c;
  --accent-fg: #ffffff;
  --accent-wash: rgba(156, 58, 28, 0.07);
  --accent-line: rgba(156, 58, 28, 0.30);

  /* syntax */
  --t-key: #7c3aad; --t-typ: #1d5b7a; --t-str: #46682a;
  --t-num: #8a4b12; --t-com: #83807a; --t-ann: #8a4b12;

  /* ---- semantic pointer roles -------------------------------
     anchor = the fixed pointer (i, or mid)   left = left / lo
     right  = right / hi                      hit  = found / valid
     "skipped" is deliberately hue-less: dim + dashed, not alarm-red.
     All four clear 4.5:1 on both --bg and --bg-sunk.
     ---------------------------------------------------------- */
  --r-anchor: #9c3a1c; --r-anchor-wash: rgba(156, 58, 28, 0.10); --r-anchor-line: rgba(156, 58, 28, 0.42);
  --r-left:   #2f5fa8; --r-left-wash:   rgba(47, 95, 168, 0.10); --r-left-line:   rgba(47, 95, 168, 0.42);
  --r-right:  #6b3a8f; --r-right-wash:  rgba(107, 58, 143, 0.10); --r-right-line:  rgba(107, 58, 143, 0.42);
  --r-hit:    #1f6b52; --r-hit-wash:    rgba(31, 107, 82, 0.10); --r-hit-line:    rgba(31, 107, 82, 0.42);
  --r-anchor2: #a8306b; --r-anchor2-wash: rgba(168,48,107,.10); --r-anchor2-line: rgba(168,48,107,.42);
  --r-window:  #12666e; --r-window-wash:  rgba(18,102,110,.10); --r-window-line:  rgba(18,102,110,.42);

  /* legacy aliases — a few inline styles in the sim script still
     reference these by name; keep them pointing at the new roles. */
  --mint: var(--r-hit); --amber: var(--r-anchor); --blue: var(--r-left);
  --violet: var(--r-right); --coral: var(--fg-dim); --gold: var(--r-anchor);
}

html[data-theme="dark"] {
  --bg: #121213;
  --bg-sunk: #1a1a1c;
  --bg-code: #1a1a1c;
  --fg: #e9e7e2;
  --fg-mid: #b8b4ac;
  --fg-dim: #93908a;
  --rule: #2b2b2e;
  --rule-hard: #3d3d41;
  --accent: #e3865f;
  --accent-fg: #16120f;
  --accent-wash: rgba(227, 134, 95, 0.10);
  --accent-line: rgba(227, 134, 95, 0.34);

  --t-key: #c191e8; --t-typ: #7bb8d6; --t-str: #9dc271;
  --t-num: #e0a86a; --t-com: #7c7a74; --t-ann: #e0a86a;

  --r-anchor: #e3865f; --r-anchor-wash: rgba(227, 134, 95, 0.14); --r-anchor-line: rgba(227, 134, 95, 0.46);
  --r-left:   #7fb0f0; --r-left-wash:   rgba(127, 176, 240, 0.14); --r-left-line:   rgba(127, 176, 240, 0.46);
  --r-right:  #bd94e8; --r-right-wash:  rgba(189, 148, 232, 0.14); --r-right-line:  rgba(189, 148, 232, 0.46);
  --r-hit:    #5fc9a3; --r-hit-wash:    rgba(95, 201, 163, 0.14); --r-hit-line:    rgba(95, 201, 163, 0.46);
  --r-anchor2: #f091bd; --r-anchor2-wash: rgba(240,145,189,.14); --r-anchor2-line: rgba(240,145,189,.46);
  --r-window:  #63c6d4; --r-window-wash:  rgba(99,198,212,.14);  --r-window-line:  rgba(99,198,212,.46);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--bg); color: var(--fg); min-height: 100%; }
body {
  font-family: var(--serif); font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  max-width: 1180px; margin: 0 auto; padding: 0 24px 72px;
}

/* ---------- appbar ---------- */
.appbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0 13px; margin-bottom: 30px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--sans); font-size: 13px;
}
.appbar a.back { color: var(--accent); text-decoration: none; }
.appbar a.back:hover { text-decoration: underline; }
.appbar .spacer { flex: 1; }
.themebtn {
  font-family: var(--sans); font-size: 12.5px; color: var(--fg-mid);
  background: transparent; border: 1px solid var(--rule-hard);
  border-radius: 7px; padding: 5px 11px; cursor: pointer;
}
.themebtn:hover { border-color: var(--accent-line); color: var(--accent); }

/* ---------- masthead ---------- */
.eyebrow {
  font-family: var(--sans); font-size: 11.5px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--fg-dim);
  display: flex; align-items: center; gap: 11px; margin-bottom: 11px;
}
.eyebrow .tag {
  font-family: var(--mono); font-weight: 500; letter-spacing: .04em;
  text-transform: none; color: var(--accent);
  background: var(--accent-wash); border: 1px solid var(--accent-line);
  border-radius: 4px; padding: 2px 8px; font-size: 11px;
}
h1 {
  font-family: var(--serif); font-size: clamp(28px, 4vw, 38px); font-weight: 600;
  line-height: 1.15; letter-spacing: -.012em;
}
h1 .thin { color: var(--fg-dim); font-weight: 400; }
.lede { color: var(--fg-mid); max-width: 68ch; margin-top: 12px; font-size: 17px; }
.lede code {
  font-family: var(--mono); font-size: .86em; color: var(--accent);
  background: var(--accent-wash); padding: 1px 6px; border-radius: 4px;
}
.lede .i { color: var(--r-anchor); font-weight: 600; }
.lede .l { color: var(--r-left);   font-weight: 600; }
.lede .r { color: var(--r-right);  font-weight: 600; }

/* ---------- input row ---------- */
.controls-top { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.field { flex: 1; min-width: 280px; }
.field label {
  display: block; font-family: var(--sans); font-size: 11.5px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 8px;
}
.input-shell { display: flex; gap: 10px; }
input[type=text] {
  flex: 1; background: var(--bg-sunk); border: 1px solid var(--rule-hard);
  color: var(--fg); font-family: var(--mono); font-size: 15px; letter-spacing: .03em;
  padding: 12px 14px; border-radius: 9px; outline: none;
  transition: border-color .13s, box-shadow .13s;
}
input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

.btn {
  font-family: var(--sans); font-weight: 500; font-size: 14px;
  border: 1px solid var(--rule-hard); background: var(--bg-sunk); color: var(--fg);
  border-radius: 9px; padding: 0 18px; height: 46px; cursor: pointer;
  transition: background .13s, border-color .13s, color .13s;
  white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { border-color: var(--accent-line); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-fg); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--rule-hard); color: var(--fg); }

.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  font-family: var(--mono); font-size: 12.5px; color: var(--fg-mid);
  background: var(--bg-sunk); border: 1px solid var(--rule);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: .13s;
}
.chip:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
.chip b { color: var(--fg-dim); font-weight: 400; margin-left: 8px; font-family: var(--sans); font-size: 12px; }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; margin-top: 26px; align-items: start; }
@media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }

.card { background: var(--bg); border: 1px solid var(--rule-hard); border-radius: 12px; overflow: hidden; }
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--bg-sunk);
}
.card-head h2 {
  font-family: var(--sans); font-size: 11.5px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--fg-dim);
}
.phase-pill {
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--rule-hard); color: var(--fg-dim); background: var(--bg);
}
.phase-pill.sort  { color: var(--fg-mid);   border-color: var(--rule-hard); }
.phase-pill.scan  { color: var(--r-anchor); border-color: var(--r-anchor-line); background: var(--r-anchor-wash); }
.phase-pill.found,
.phase-pill.done  { color: var(--r-hit);    border-color: var(--r-hit-line);    background: var(--r-hit-wash); }

/* ---------- the tape ---------- */
.stage {
  padding: 30px 20px 20px; min-height: 190px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.tape { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
.col { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 50px; }
@media (max-width: 560px) { .col { width: 38px; } }

.caret {
  height: 20px; font-family: var(--mono); font-size: 11px; font-weight: 500;
  display: flex; gap: 3px; align-items: center; justify-content: center; transition: opacity .18s;
}
.caret .p { padding: 1px 6px; border-radius: 4px; line-height: 1.35; }
.caret .pI { color: var(--accent-fg); background: var(--r-anchor); }
.caret .pL { color: var(--accent-fg); background: var(--r-left); }
.caret .pR { color: var(--accent-fg); background: var(--r-right); }

.cell {
  width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 19px; font-weight: 500; border-radius: 9px;
  background: var(--bg-sunk); border: 1.5px solid var(--rule-hard); color: var(--fg);
  transition: transform .22s ease, background .18s, border-color .18s, color .18s;
  position: relative;
}
@media (max-width: 560px) { .cell { font-size: 15px; } }

.cell.fixed { background: var(--r-anchor-wash); border-color: var(--r-anchor); color: var(--r-anchor); transform: translateY(-5px); }
.cell.left  { background: var(--r-left-wash);   border-color: var(--r-left);   color: var(--r-left);   transform: translateY(-3px); }
.cell.right { background: var(--r-right-wash);  border-color: var(--r-right);  color: var(--r-right);  transform: translateY(-3px); }
.cell.found { background: var(--r-hit-wash);    border-color: var(--r-hit);    color: var(--r-hit); }
/* discarded / already-explored: hue-less, just receded */
.cell.skipped { opacity: .38; border-style: dashed; border-color: var(--rule); }
.cell.dupskip {
  background: var(--bg-sunk); border-style: dashed; border-color: var(--fg-dim);
  color: var(--fg-dim); text-decoration: line-through; text-decoration-thickness: 1.5px;
}

.idx { font-family: var(--mono); font-size: 10.5px; color: var(--fg-dim); transition: color .18s; }
.idx.on { color: var(--accent); font-weight: 500; }

.sum-line { font-family: var(--mono); font-size: 14.5px; color: var(--fg-dim); display: flex; gap: 10px; align-items: center; }
.sum-line b { color: var(--fg); font-weight: 500; }

.message {
  font-family: var(--sans); font-size: 14px; line-height: 1.6; color: var(--fg-mid);
  text-align: center; max-width: 640px; min-height: 46px; padding: 0 6px;
}
.message b { color: var(--fg); font-weight: 600; }
.message .i { color: var(--r-anchor); font-weight: 600; }
.message .l { color: var(--r-left);   font-weight: 600; }
.message .r { color: var(--r-right);  font-weight: 600; }
.message .m { color: var(--r-hit);    font-weight: 600; }
.message .x { color: var(--fg-dim);   font-weight: 600; }
.message .k, .lede .k {
  font-family: var(--mono); font-size: .88em; color: var(--accent);
  background: var(--accent-wash); padding: 1px 5px; border-radius: 4px;
}

.triplets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; }
.trip {
  font-family: var(--mono); font-size: 12.5px; color: var(--r-hit);
  background: var(--r-hit-wash); border: 1px solid var(--r-hit-line);
  border-radius: 999px; padding: 4px 12px;
}

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-top: 1px solid var(--rule); flex-wrap: wrap; background: var(--bg-sunk);
}
.icon-btn { width: 40px; height: 40px; padding: 0; font-size: 14px; }
.progress-wrap { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 12px; }
.progress { flex: 1; height: 5px; background: var(--bg); border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .18s; }
.step-count { font-family: var(--mono); font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
.speed {
  display: flex; align-items: center; gap: 9px; font-family: var(--sans);
  font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-dim);
}
.speed input { accent-color: var(--accent); width: 92px; }

/* ---------- code pane ---------- */
.code {
  padding: 14px 4px 14px 0; font-family: var(--mono); font-size: 12.6px;
  line-height: 1.7; overflow-x: auto; background: var(--bg-code);
}
.code .ln { display: flex; padding: 1px 18px 1px 0; white-space: pre; position: relative; transition: background .16s; }
.code .ln .no { width: 34px; text-align: right; padding-right: 16px; color: var(--fg-dim); opacity: .65; user-select: none; flex-shrink: 0; }
.code .kw { color: var(--t-key); }
.code .ty { color: var(--t-typ); }
.code .fn { color: var(--t-ann); }
.code .tx { color: var(--fg-mid); }
.code .ln.exec { background: var(--accent-wash); }
.code .ln.exec .no { color: var(--accent); opacity: 1; }
.code .ln.exec::before { content: ""; position: absolute; left: 0; width: 2.5px; top: 1px; bottom: 1px; background: var(--accent); }

/* ---------- legend ---------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 16px;
  border-top: 1px solid var(--rule); font-family: var(--sans); font-size: 12px; color: var(--fg-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; }
.dot.i { background: var(--r-anchor-wash); border-color: var(--r-anchor); }
.dot.l { background: var(--r-left-wash);   border-color: var(--r-left); }
.dot.r { background: var(--r-right-wash);  border-color: var(--r-right); }
.dot.m { background: var(--r-hit-wash);    border-color: var(--r-hit); }
.dot.x { background: var(--bg-sunk); border-color: var(--fg-dim); border-style: dashed; }

.foot {
  margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--rule);
  font-family: var(--sans); font-size: 12.5px; color: var(--fg-dim);
  text-align: center; line-height: 1.7;
}
.foot code {
  font-family: var(--mono); font-size: .92em; color: var(--accent);
  background: var(--accent-wash); padding: 1px 5px; border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .cell, .progress .bar, .caret { transition: none !important; }
  .cell.fixed, .cell.left, .cell.right { transform: none; }
}
</style>
<script>
/* set the theme before first paint to avoid a flash.
   shares tpswbs.v1.theme with the three-patterns bundle, so the
   setting carries across the doc -> visualizer seam. */
(function(){try{var p=JSON.parse(localStorage.getItem("tpswbs.v1.theme")||'"auto"');
var d=window.matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.setAttribute("data-theme",p==="auto"?(d?"dark":"light"):p);}catch(e){}})();
</script>
</head>
