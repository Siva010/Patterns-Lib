<script>
/* ============================================================================
   226. Invert Binary Tree — adapter for the shared lab engine.

   This page REWIRES the input tree rather than computing a value, so the whole
   story is told with LINK events on panel 0. Anything not written shows through
   from the input, which is why inverting a 7-node tree emits 12 LINK events and
   no NODE events at all.

   The three variants are the three implementations the essay itself discusses:
     post  §2   capture L and R into locals, then assign      (correct)
     pre   §2.2 swap first, then recurse into the new children (correct)
     bad   §2.1 the self-destroying swap                       (WRONG)

   Frame keys are normally the node's root-path key. `bad` re-enters the same
   node a second time, which would collide, so every call carries an explicit
   `refs` pointing at the real node and re-entries get a "#n" suffix on the
   frame key alone.
   ========================================================================== */
(function () {
  "use strict";
  var T = window.TreeLab;
  if (!T) return;

  function dim(s) { return '<span class="tl-dim">' + s + "</span>"; }
  function nd(s) { return '<span class="tl-k-node">' + s + "</span>"; }
  function sideCol(s, which) {
    return '<span class="' + (which === "left" ? "tl-k-left" : "tl-k-right") + '">' + s + "</span>";
  }
  function F(v) { return T.fmtVal(v); }
  /* a key like "RLR" read aloud as an address */
  function addr(k) {
    if (!k) return "null";
    if (k === "R") return "root";
    return "root" + k.slice(1).split("").map(function (c) { return "." + c; }).join("");
  }

  /* ------------------------------------------------------------------ source */
  var JAVA_POST = [
    "TreeNode invert(TreeNode nd) {",
    "    if (nd == null) return null;",
    "    TreeNode L = invert(nd.left);    // capture both BEFORE assigning either",
    "    TreeNode R = invert(nd.right);",
    "    nd.left  = R;",
    "    nd.right = L;",
    "    return nd;",
    "}"
  ];
  var L_POST = { TOP: 1, NULL: 2, RECL: 3, RECR: 4, WL: 5, WR: 6, RET: 7 };

  var JAVA_PRE = [
    "TreeNode invert(TreeNode nd) {",
    "    if (nd == null) return null;",
    "    TreeNode t = nd.left;",
    "    nd.left  = nd.right;",
    "    nd.right = t;",
    "    invert(nd.left);                 // the OLD right",
    "    invert(nd.right);                // the OLD left",
    "    return nd;",
    "}"
  ];
  var L_PRE = { TOP: 1, NULL: 2, SAVE: 3, WL: 4, WR: 5, RECL: 6, RECR: 7, RET: 8 };

  var JAVA_BAD = [
    "TreeNode invert(TreeNode nd) {          // ✗",
    "    if (nd == null) return null;",
    "    nd.left  = invert(nd.right);",
    "    nd.right = invert(nd.left);         // nd.left is the NEW left — the old right",
    "    return nd;",
    "}"
  ];
  var L_BAD = { TOP: 1, NULL: 2, WL: 3, WR: 4, RET: 5 };

  /* ------------------------------------------------------------------- run */
  function makeRun() {
    return function (root, emit, o) {
      var id = o.id, L = o.L;
      var seen = {};                       /* node key -> times entered */
      var writes = 0, swaps = 0;

      function frameKey(nodeKey) {
        seen[nodeKey] = (seen[nodeKey] || 0) + 1;
        return seen[nodeKey] === 1 ? nodeKey : nodeKey + "#" + seen[nodeKey];
      }
      function em(e) { emit(e); return e; }
      function call(node, nodeKey, fk, parentFk, side, depth) {
        em({ type: "CALL", key: fk, parentKey: parentFk, side: side, depth: depth,
             isNull: !node, val: node ? node.val : null, line: L.TOP,
             args: node ? "invert(" + node.val + ")" : "invert(null)",
             nodeKey: nodeKey,
             refs: node ? [{ t: 0, key: nodeKey }] : [] });
      }
      function link(parentNodeKey, side, childNodeKey, fk, line, note) {
        writes++;
        em({ type: "LINK", t: 0, parent: parentNodeKey, side: side, child: childNodeKey,
             key: fk, line: line, note: note || "" });
      }

      em({ type: "START", line: L.TOP, id: id });

      /* returns the node key of the subtree root handed back, or null */
      function go(node, nodeKey, parentFk, side, depth) {
        var fk = node ? frameKey(nodeKey) : frameKey(nodeKey);
        call(node, nodeKey, fk, parentFk, side, depth);
        if (!node) {
          em({ type: "BASE", key: fk, depth: depth, line: L.NULL, value: null });
          em({ type: "RETURN", key: fk, parentKey: parentFk, side: side, depth: depth,
               value: null, line: L.NULL, reason: "null" });
          return null;
        }
        var lk = node.left ? nodeKey + "L" : null;
        var rk = node.right ? nodeKey + "R" : null;

        if (id === "post") {
          em({ type: "EVAL", key: fk, side: "left", line: L.RECL });
          go(node.left, nodeKey + "L", fk, "left", depth + 1);
          em({ type: "EVAL", key: fk, side: "right", line: L.RECR });
          go(node.right, nodeKey + "R", fk, "right", depth + 1);
          /* both children captured; now the two writes cannot disturb each other */
          if (lk || rk) swaps++;
          link(nodeKey, "left", rk, fk, L.WL, "first");
          link(nodeKey, "right", lk, fk, L.WR, "second");

        } else if (id === "pre") {
          if (lk || rk) swaps++;
          link(nodeKey, "left", rk, fk, L.WL, "first");
          link(nodeKey, "right", lk, fk, L.WR, "second");
          /* the Java recurses into nd.left then nd.right, which AFTER the swap
             are the old right and the old left — each visited exactly once */
          em({ type: "EVAL", key: fk, side: "left", line: L.RECL });
          go(node.right, nodeKey + "R", fk, "left", depth + 1);
          em({ type: "EVAL", key: fk, side: "right", line: L.RECR });
          go(node.left, nodeKey + "L", fk, "right", depth + 1);

        } else { /* bad */
          em({ type: "EVAL", key: fk, side: "left", line: L.WL });
          go(node.right, nodeKey + "R", fk, "left", depth + 1);
          if (lk || rk) swaps++;
          link(nodeKey, "left", rk, fk, L.WL, "first");
          /* nd.left now names the OLD RIGHT subtree. Reading nd.left here walks
             into it a second time, and the old left is never visited at all. */
          em({ type: "EVAL", key: fk, side: "right", line: L.WR });
          go(node.right, nodeKey + "R", fk, "right", depth + 1);
          link(nodeKey, "right", rk, fk, L.WR, "second");
        }

        em({ type: "RETURN", key: fk, parentKey: parentFk, side: side, depth: depth,
             value: node.val, line: L.RET, reason: "node", nodeKey: nodeKey });
        return nodeKey;
      }

      go(root, "R", null, null, 0);
      em({ type: "DONE", line: L.RET, depth: 0, value: root ? root.val : null,
           writes: writes, swaps: swaps, empty: !root, id: id });
      return root ? root.val : null;
    };
  }

  /* --------------------------------------------------------------- display */
  function exprOf(f, st) {
    if (f.isNull) return dim("return null") + " " + dim("— nothing to invert");
    if (f.result !== undefined) return dim("return ") + nd(F(f.val)) + dim(" — its two pointers are now swapped");
    return dim("invert(") + nd(F(f.val)) + dim(") — waiting on its children");
  }

  function narrate(st) {
    var e = st.event || {};
    if (e.type === "START") {
      return { tag: "start", text: "Inverting in place. Nothing is copied — the only thing that " +
        "changes is which child each node points at, so watch the " + sideCol("left", "left") +
        " and " + sideCol("right", "right") + " pointers, not the values." };
    }
    if (e.type === "LINK") {
      var who = addr(e.parent), child = e.child ? addr(e.child) : "null";
      if (e.note === "first") {
        return { tag: "write 1 of 2", text: who + ".left now points at " + nd(child) + ". " +
          "For this one step both of " + who + "'s pointers name that same subtree — it is drawn " +
          "once, on the left, and the right side reads empty. Nothing has been lost; the second " +
          "write is what separates them again." };
      }
      return { tag: "write 2 of 2", text: who + ".right now points at " + nd(child) +
        ". The swap at " + who + " is complete." };
    }
    if (e.type === "BASE") return { tag: "base", text: "A null pointer. Return null and unwind." };
    if (e.type === "RETURN") return { tag: "return", text: addr(e.nodeKey) + " hands itself back, already inverted." };
    if (e.type === "DONE") {
      if (e.empty) return { tag: "done", text: "Empty tree — nothing to do." };
      return { tag: "done", text: "Every node visited once, " + e.writes + " pointer writes in total. " +
        (e.id === "bad"
          ? "But look at the shape: the old right subtree appears twice, and the old left is gone."
          : "The tree is its own mirror image.") };
    }
    return null;
  }

  function stats(st) {
    var out = [], b = st.built && st.built[0];
    var w = 0;
    if (b) for (var p in b.kids) for (var s in b.kids[p]) w++;
    out.push({ label: "pointer writes", html: "<b>" + w + "</b>" });
    if (st.event && st.event.type === "LINK") {
      out.push({ label: "writing", html: sideCol(addr(st.event.parent) + "." + st.event.side, st.event.side) });
    }
    return out;
  }

  function verdict(st) {
    if (!st.done) return null;
    if (st.done.empty) return { ok: true, text: "empty tree" };
    if (st.done.id === "bad") {
      return { ok: false, text: "the old right subtree now appears on both sides — the old left was dropped" };
    }
    return { ok: true, text: "inverted: every node's children are swapped" };
  }

  /* ---------------------------------------------------------------- mount */
  T.mount({
    mountEl: "#lab",
    title: "invert(nd)",
    subtitle: "rewiring in place — the values never move, only the pointers",
    tag: "interactive",
    structureNote: "the tree itself, rewired as the recursion unwinds",
    callTreeNote: "one call per node, plus a leaf for every null pointer",
    presets: [
      { tokens: "[4,2,7,1,3,6,9]", note: "the tree above — a perfect tree, so the mirror is easy to check by eye" },
      { tokens: "[1,2,null,3,null,4]", note: "a left chain — inverting turns it into a right chain, the most legible case there is" },
      { tokens: "[1,2,3,4,null,null,5]", note: "asymmetric: the two subtrees have different shapes, so a dropped subtree would be obvious" },
      { tokens: "[1,2,3]", note: "the smallest tree with anything to swap" },
      { tokens: "[1]", note: "a single node — one call, no writes" },
      { tokens: "[]", note: "empty" }
    ],
    variants: [
      { id: "post", label: "postorder — capture, then assign", java: JAVA_POST, lines: L_POST },
      { id: "pre", label: "preorder — swap, then recurse", java: JAVA_PRE, lines: L_PRE },
      { id: "bad", label: "✗ the self-destroying swap", java: JAVA_BAD, lines: L_BAD }
    ],
    run: makeRun(),
    expr: exprOf,
    narrate: narrate,
    stats: stats,
    verdict: verdict,
    isFail: function () { return false; },
    nodeResult: function () { return null; },
    legend: [
      { state: "active", text: "the call running now" },
      { state: "path", text: "on the stack" },
      { state: "done", text: "returned — pointers settled" },
      { state: "ghost", text: "not reached yet" }
    ]
  });
})();
</script>
